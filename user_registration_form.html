<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .form-card {
            background-color: #ffffff;
            max-width: 520px;
            width: 100%;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }
        .form-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .form-header h2 {
            color: #0f172a;
            font-size: 24px;
            margin: 0 0 8px 0;
            border-bottom: 3px solid #3b82f6;
            display: inline-block;
            padding-bottom: 6px;
        }
        .form-header p {
            color: #64748b;
            font-size: 14px;
            margin: 6px 0 0 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label.form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
        }
        label.form-label .required {
            color: #ef4444;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #f8fafc;
            transition: all 0.2s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .radio-group {
            display: flex;
            gap: 24px;
            padding-top: 4px;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 15px;
            color: #334155;
        }
        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #2563eb;
        }
        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-header">
            <h2>ĐĂNG KÝ NGƯỜI DÙNG</h2>
            <p>Vui lòng nhập đầy đủ thông tin bên dưới để hoàn tất đăng ký</p>
        </div>

        <!-- Thẻ <form> bắt buộc cấu hình action gửi về server POST theo đúng yêu cầu đề bài -->
        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            
            <!-- Trường Họ và tên (name="name") -->
            <div class="form-group">
                <label class="form-label" for="name">Họ và tên <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="Nhập họ và tên..." required>
            </div>

            <!-- Trường Email (name="email") -->
            <div class="form-group">
                <label class="form-label" for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <!-- Trường Số điện thoại (name="phone") -->
            <div class="form-group">
                <label class="form-label" for="phone">Số điện thoại <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="0987654321" required>
            </div>

            <!-- Trường Giới tính (name="gender") -->
            <div class="form-group">
                <label class="form-label">Giới tính</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="gender" value="Nam" checked> Nam
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="gender" value="Nữ"> Nữ
                    </label>
                </div>
            </div>

            <!-- Nút Đăng ký (Submit Form) -->
            <button type="submit" class="btn-submit">Đăng ký</button>
        </form>
    </div>

</body>
</html>
