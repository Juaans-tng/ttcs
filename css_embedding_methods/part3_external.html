<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 3: External-Style</title>
    <!-- Phần 3: Thay đổi màu sắc của văn bản sử dụng external-style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="padding-top: 40px;">
        <h1 class="external-heading" style="font-size: 32px;">Tiêu đề sử dụng External-style</h1>
        <p class="external-paragraph" style="font-size: 16px;">
            Đoạn văn này được định dạng màu sắc thông qua tệp CSS riêng biệt (style.css) và liên kết bằng thẻ link.
        </p>
    </div>
</body>
</html>
