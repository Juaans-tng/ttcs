<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Phần 1: Inline-Style</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 40px; background-color: #f8fafc;">
    <!-- Phần 1: Thay đổi màu sắc của văn bản sử dụng inline-style -->

    <p style="color: #4b5563; font-size: 16px; line-height: 1.6;">
        Đoạn văn này được định dạng màu sắc trực tiếp thông qua thuộc tính style ngay trên thẻ p.
    </p>
</body>
