<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng đơn giản trong HTML</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fafc;
            color: #2d3748;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        h2 {
            color: #2b6cb0;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 3px solid #bee3f8;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
        }
        th {
            background-color: #ebf8ff;
            color: #2c5282;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f7fafc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Danh sách học sinh</h2>

        <!-- Thẻ <table> với border="1" theo đúng đề bài -->
        <table border="1">
            <tr>
                <th>Họ và Tên</th>
                <th>Tuổi</th>
                <th>Lớp</th>
            </tr>
            <tr>
                <td>Nguyễn Văn A</td>
                <td>15</td>
                <td>10A1</td>
            </tr>
            <tr>
                <td>Trần Thị B</td>
                <td>16</td>
                <td>11B2</td>
            </tr>
            <tr>
                <td>Lê Văn C</td>
                <td>17</td>
                <td>12C3</td>
            </tr>
        </table>
    </div>
</body>
</html>
