<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gộp ô trong bảng với rowspan và colspan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7fafc;
            color: #2d3748;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            max-width: 620px;
            width: 100%;
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        h2 {
            color: #2b6cb0;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 3px solid #bee3f8;
            padding-bottom: 10px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 14px 18px;
            text-align: center;
        }
        th {
            background-color: #ebf8ff;
            color: #2c5282;
            font-weight: bold;
        }
        td[rowspan] {
            background-color: #ebf8ff;
            font-weight: bold;
            color: #2b6cb0;
            vertical-align: middle;
        }
        td[colspan] {
            background-color: #feefc3;
            color: #744210;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Thời khóa biểu</h2>

        <!-- Thẻ <table> với thuộc tính border="1", rowspan và colspan theo đúng đề bài -->
        <table border="1">
            <tr>
                <th>Thứ</th>
                <th>Môn học</th>
                <th>Giáo viên</th>
            </tr>
            <tr>
                <!-- Gộp 2 hàng cho Thứ Hai -->
                <td rowspan="2">Thứ Hai</td>
                <td>Toán</td>
                <td>Thầy Nam</td>
            </tr>
            <tr>
                <td>Văn</td>
                <td>Cô Hạnh</td>
            </tr>
            <tr>
                <td>Thứ Ba</td>
                <!-- Gộp 2 cột cho thông báo Nghỉ học -->
                <td colspan="2">Nghỉ học</td>
            </tr>
        </table>
    </div>
</body>
</html>
