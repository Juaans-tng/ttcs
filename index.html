<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Tạo Form Đơn Giản - CodeGym</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            margin: 0;
            padding: 30px 20px;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .nav-btn {
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active, .nav-btn:hover {
            background-color: #2563eb;
            color: #ffffff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        iframe {
            width: 100%;
            height: 820px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>BÀI TẬP TẠO FORM ĐƠN GIẢN</h1>

        <div class="nav-tabs">
            <button class="nav-btn active" onclick="showTab('part1', this)">Phần 1: Form Sở Thích</button>
            <button class="nav-btn" onclick="showTab('part2', this)">Phần 2: Form Đăng Ký Học Viên</button>
        </div>

        <div id="part1" class="tab-content active">
            <iframe src="form_exercise_p1.html"></iframe>
        </div>

        <div id="part2" class="tab-content">
            <iframe src="student_registration_form.html"></iframe>
        </div>
    </div>

    <script>
        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
