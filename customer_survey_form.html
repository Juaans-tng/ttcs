<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Research Survey - Khảo Sát Khách Hàng</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .survey-container {
            background-color: #ffffff;
            max-width: 680px;
            width: 100%;
            padding: 40px 45px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }
        .survey-header {
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .survey-header h2 {
            font-size: 26px;
            color: #1e3a8a;
            margin: 0 0 10px 0;
        }
        .survey-header p {
            color: #4b5563;
            margin: 0;
            font-size: 15px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 28px;
        }
        .field-label {
            display: block;
            font-weight: 600;
            font-size: 15px;
            color: #111827;
            margin-bottom: 10px;
        }
        select, textarea, input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            background-color: #f9fafb;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        select:focus, textarea:focus, input[type="text"]:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 15px;
            color: #374151;
        }
        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .other-input {
            margin-top: 6px;
            margin-left: 28px;
            width: calc(100% - 28px);
        }
        .price-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .currency-symbol {
            font-weight: bold;
            font-size: 18px;
            color: #374151;
        }
        .price-input-dollars {
            width: 120px !important;
        }
        .price-input-cents {
            width: 70px !important;
        }

        /* Likert Rating Table */
        .likert-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .likert-table th, .likert-table td {
            padding: 12px 10px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        .likert-table thead th {
            background-color: #f3f4f6;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }
        .likert-table tbody th {
            text-align: left;
            font-weight: normal;
            font-size: 14px;
            background-color: #ffffff;
            color: #1f2937;
        }
        .likert-table tbody tr:nth-child(even) {
            background-color: #f9fafb;
        }
        .likert-table tbody tr:nth-child(even) th {
            background-color: #f9fafb;
        }
        .likert-table input[type="radio"] {
            accent-color: #2563eb;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .btn-submit {
            background-color: #2563eb;
            color: #ffffff;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="survey-container">
        <div class="survey-header">
            <h2>Market Research Survey</h2>
            <p>Please take a few moments to complete this satisfaction survey.</p>
        </div>

        <form action="#" method="post">

            <!-- Q1: Age range -->
            <div class="form-group">
                <label class="field-label" for="age">What is your age range?</label>
                <select id="age" name="age">
                    <option value="18-24">18-24</option>
                    <option value="25-34">25-34</option>
                    <option value="35-50">35-50</option>
                    <option value="50+">50+</option>
                </select>
            </div>

            <!-- Q2: Income range -->
            <div class="form-group">
                <label class="field-label" for="income">What is your yearly income range?</label>
                <select id="income" name="income">
                    <option value="$0 - $25,000">$0 - $25,000</option>
                    <option value="$25,001 - $50,000">$25,001 - $50,000</option>
                    <option value="$50,001 - $100,000">$50,001 - $100,000</option>
                    <option value="$100,000+">$100,000+</option>
                </select>
            </div>

            <!-- Q3: Gender Identity -->
            <div class="form-group">
                <label class="field-label">Gender Identity</label>
                <div class="options-list">
                    <label class="option-item"><input type="radio" name="gender" value="Male"> Male</label>
                    <label class="option-item"><input type="radio" name="gender" value="Female"> Female</label>
                    <label class="option-item"><input type="radio" name="gender" value="Nonbinary"> Nonbinary</label>
                    <label class="option-item"><input type="radio" name="gender" value="Other"> Other</label>
                    <input type="text" class="other-input" name="gender_other" placeholder="Please specify if Other...">
                </div>
            </div>

            <!-- Q4: Products Purchased -->
            <div class="form-group">
                <label class="field-label">Which of the following products have you purchased in the last 2 months. Please check all that apply.</label>
                <div class="options-list">
                    <label class="option-item"><input type="checkbox" name="products[]" value="Product 1"> Product 1</label>
                    <label class="option-item"><input type="checkbox" name="products[]" value="Product 2"> Product 2</label>
                    <label class="option-item"><input type="checkbox" name="products[]" value="Product 3"> Product 3</label>
                </div>
            </div>

            <!-- Q5: Usage Frequency -->
            <div class="form-group">
                <label class="field-label">How often would you use our new product?</label>
                <div class="options-list">
                    <label class="option-item"><input type="radio" name="frequency" value="Daily"> Daily</label>
                    <label class="option-item"><input type="radio" name="frequency" value="Weekly"> Weekly</label>
                    <label class="option-item"><input type="radio" name="frequency" value="Monthly"> Monthly</label>
                </div>
            </div>

            <!-- Q6: Expected Price -->
            <div class="form-group">
                <label class="field-label">What would you pay for the new product?</label>
                <div class="price-group">
                    <span class="currency-symbol">$</span>
                    <input type="text" class="price-input-dollars" name="dollars" placeholder="Dollars">
                    <span class="currency-symbol">.</span>
                    <input type="text" class="price-input-cents" name="cents" placeholder="Cents" maxlength="2">
                </div>
            </div>

            <!-- Q7: Features Request -->
            <div class="form-group">
                <label class="field-label" for="features">What features would you like to see in the new product.</label>
                <textarea id="features" name="features" placeholder="Type your ideas and requested features here..."></textarea>
            </div>

            <!-- Q8: Likert Rating Scale Table -->
            <div class="form-group">
                <label class="field-label">Please rate your level of agreement with the following statements.</label>
                <table class="likert-table">
                    <thead>
                        <tr>
                            <th>&nbsp;</th>
                            <th>Strongly Disagree</th>
                            <th>Disagree</th>
                            <th>Agree</th>
                            <th>Strongly Agree</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <th>Our products are priced fairly.</th>
                            <td><input type="radio" name="rating_price" value="Strongly Disagree"></td>
                            <td><input type="radio" name="rating_price" value="Disagree"></td>
                            <td><input type="radio" name="rating_price" value="Agree"></td>
                            <td><input type="radio" name="rating_price" value="Strongly Agree"></td>
                        </tr>
                        <tr>
                            <th>Our products are high quality.</th>
                            <td><input type="radio" name="rating_quality" value="Strongly Disagree"></td>
                            <td><input type="radio" name="rating_quality" value="Disagree"></td>
                            <td><input type="radio" name="rating_quality" value="Agree"></td>
                            <td><input type="radio" name="rating_quality" value="Strongly Agree"></td>
                        </tr>
                        <tr>
                            <th>You would recommend our product to a friend or coworker.</th>
                            <td><input type="radio" name="rating_recommend" value="Strongly Disagree"></td>
                            <td><input type="radio" name="rating_recommend" value="Disagree"></td>
                            <td><input type="radio" name="rating_recommend" value="Agree"></td>
                            <td><input type="radio" name="rating_recommend" value="Strongly Agree"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Submit</button>

        </form>
    </div>

</body>
</html>
